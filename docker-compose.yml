services:
  api:
    build: .
    working_dir: /app
    command: uvicorn Backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build: .
    working_dir: /app
    command: uvicorn Backend.main:app --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    environment:
    depends_on:
      - api
    restart: unless-stopped
